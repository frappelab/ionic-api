<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de tareas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="calculator">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list>
    @for(task of tareas; track task._id){
    <ion-item>
      <ion-label>{{task.title}}</ion-label>
    </ion-item>
    }@empty {
    <ion-item>
      No hay tareas
    </ion-item>
    }
  </ion-list>

  <ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-input label="Ingresa el título de la tarea" labelPlacement="stacked" type="text" placeholder="título"
            [(ngModel)]="title"></ion-input>
          <ion-input label="Ingresa la descripcion de la tarea" labelPlacement="stacked" type="text"
            placeholder="Descripción" [(ngModel)]="description"></ion-input>
        </ion-item>
      </ion-content>
    </ng-template>
  </ion-modal>

  <ion-button id="open-modal" expand="block">Crear</ion-button>

</ion-content>
